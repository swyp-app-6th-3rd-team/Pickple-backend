services:
  mysql:
    image: mysql:8.4
    container_name: ${COMPOSE_PROJECT_NAME:-pickple}-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 를 .env 에 설정하세요}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pickple}
      MYSQL_USER: ${MYSQL_USER:-pickple}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 를 .env 에 설정하세요}
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 초기 스키마와 JPA 엔티티가 모두 소문자 테이블명을 쓴다.
      # 온프레미스 리눅스 호스트는 기본값이 0(대소문자 구분)이라 명시한다.
      - --lower_case_table_names=0
      # 시간 컬럼을 LocalDateTime 으로 다루므로 서버 타임존을 고정한다.
      - --default-time-zone=+09:00
      - --max_connections=200
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 앱이 DB 준비 전에 떠서 Flyway 가 실패하는 것을 막는다.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    # 기본으로는 뜨지 않는다. 로컬 개발에서는 DB 만 띄우고 앱은 IDE 에서 실행한다.
    #   docker compose up -d              → mysql 만
    #   docker compose --profile app up -d → mysql + app
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-pickple}-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-pickple}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-pickple}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY 를 .env 에 설정하세요}
      # 빈 문자열이 아니라 자리표시자를 넘긴다.
      # compose 의 :- 는 변수가 "미설정"일 때만 발동한다. .env 에 `OAUTH_...=` 처럼
      # 빈 값이 있으면 빈 문자열을 그대로 전달해 application.yml 의 기본값을 덮고,
      # Spring 이 "Client id of registration must not be empty" 로 기동을 거부한다.
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-not-configured}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-not-configured}
      OAUTH_KAKAO_CLIENT_ID: ${OAUTH_KAKAO_CLIENT_ID:-not-configured}
      OAUTH_KAKAO_CLIENT_SECRET: ${OAUTH_KAKAO_CLIENT_SECRET:-not-configured}
      OAUTH_NAVER_CLIENT_ID: ${OAUTH_NAVER_CLIENT_ID:-not-configured}
      OAUTH_NAVER_CLIENT_SECRET: ${OAUTH_NAVER_CLIENT_SECRET:-not-configured}
      TZ: ${TZ:-Asia/Seoul}
      # logback-spring.xml 이 읽는 로그 위치. 아래 볼륨이 이 경로를 호스트에 연결한다.
      LOG_DIR: /app/logs
      LOG_MAX_HISTORY: ${LOG_MAX_HISTORY:-30}
      LOG_TOTAL_SIZE_CAP: ${LOG_TOTAL_SIZE_CAP:-3GB}
    volumes:
      # 로그를 호스트에 영속화한다.
      #
      # 컨테이너 계층에만 로그가 쌓이면 `docker rm` 한 순간 장애 조사에 필요한 기록이
      # 통째로 사라진다. 이미지는 읽기 전용이고 변경분은 컨테이너 계층에만 남기 때문이다.
      #
      # named volume 을 쓴다. 호스트 경로는 `docker volume inspect` 의 Mountpoint 로 찾는다.
      # bind mount 를 쓰고 싶으면 아래 두 줄로 바꾼다(호스트 경로가 직관적이지만
      # 디렉터리 소유권을 직접 맞춰야 한다 — README 참조):
      #   - ./logs:/app/logs
      - type: volume
        source: app_log
        target: /app/logs
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      # actuator 는 관리 포트(9090)에만 있다. 서비스 포트(8080)엔 없다.
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  mysql_data:
    name: ${COMPOSE_PROJECT_NAME:-pickple}_mysql_data

  # 로그 볼륨.
  #
  # compose 가 직접 관리한다. 템플릿에서 "먼저 `docker volume create` 하세요"라는
  # 수동 절차를 요구하지 않기 위해서다.
  #
  # 대신 `name:` 을 고정해 compose 가 프로젝트명 접두어를 붙이지 않게 했다.
  # 이렇게 하면 `docker compose down` 후 다시 올려도 같은 볼륨을 재사용하고,
  # 호스트에서 찾을 때 이름이 예측 가능하다.
  #
  # 볼륨을 별도 수명주기로 관리하고 싶다면(예: 여러 compose 파일이 공유)
  #   docker volume create --name pickple-log
  # 로 만든 뒤 아래를 `external: true` 로 바꾼다.
  app_log:
    name: ${COMPOSE_PROJECT_NAME:-pickple}-log
