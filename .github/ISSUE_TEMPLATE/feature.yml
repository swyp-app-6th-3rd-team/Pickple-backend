name: 기능
description: 새 기능이나 개선 제안
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결할 문제
      description: 지금 무엇이 안 되는가. 기능이 아니라 문제를 먼저 쓴다.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안
      description: 어떻게 풀 것인가.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 범위
      description: 제외를 비워두지 말 것. 무엇을 안 하는지가 범위를 정한다.
      value: |
        **포함**
        -

        **제외**
        -
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 판정
      description: 측정 가능한 것만. "잘 동작한다" ✗ · 빌드 green·테스트 통과 같은 대리지표 ✗
      value: |
        | 판정 | 검증 방법 |
        |---|---|
        |  |  |
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 대안
      description: 기각 사유가 곧 이 선택의 방어 근거다.
      value: |
        | 대안 | 기각 사유 |
        |---|---|
        |  |  |
    validations:
      required: false
