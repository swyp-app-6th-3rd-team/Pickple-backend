# develop 브랜치 배포.
#
# 이 워크플로에는 secrets.* 참조가 **하나도 없다**(ADR-0013).
#   - AWS 자격증명 → OIDC 로 1시간짜리 토큰을 받는다
#   - SSH 개인키   → 쓰지 않는다. SSM Run Command 로 배포한다
#   - 런타임 비밀  → EC2 가 Secrets Manager 에서 스스로 조회한다
#
# 테스트는 ci.yml 이 담당한다. 여기서는 빌드와 배포만 한다.
name: deploy-develop

on:
  # 인프라를 걷어낼 때는 이 push 트리거를 다시 주석 처리한다(terraform/README.md).
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "롤백할 이미지 태그 (예: develop-123456). 비우면 현재 커밋을 빌드한다"
        required: false
        type: string

concurrency:
  group: deploy-develop
  cancel-in-progress: false # 배포 중 취소는 중간 상태를 남긴다

permissions:
  id-token: write # OIDC 토큰 발급에 필수. 빠뜨리면 조용히 실패한다
  contents: read

jobs:
  deploy:
    # arm64 네이티브 러너. PUBLIC 저장소라 무료이고, QEMU 에뮬레이션이 필요 없다.
    # x86 인스턴스로 바꾸면 ubuntu-24.04 로 되돌린다.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: true

      - name: Resolve image tag
        id: tag
        # ⚠️ image_tag 는 사람이 입력하는 값이다. 두 가지를 지킨다.
        #   1. ${{ }} 로 run: 안에 직접 펼치지 않는다 — 펼치면 러너에서 셸 주입이 된다.
        #      env: 로 넘겨 셸 변수로만 다룬다.
        #   2. 형식을 정규식으로 검증한다 — 이 값은 아래에서 SSM 을 통해
        #      EC2 의 루트 셸에 전달되므로, 메타문자가 들어가면 원격 명령 실행이 된다.
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            if ! printf '%s' "$INPUT_TAG" | grep -qE '^develop-[0-9]+$'; then
              echo "::error::image_tag 형식이 올바르지 않습니다: '$INPUT_TAG'"
              echo "::error::develop-<숫자> 형식만 허용합니다 (예: develop-1234567890)"
              exit 1
            fi
            echo "value=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=develop-$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.tag.outputs.build == 'true'
        env:
          IMAGE: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}
        run: |
          # 두 태그를 붙인다.
          #   develop-<run_id>  불변 — 배포와 롤백이 이걸 가리킨다
          #   develop           이동 — 최신 확인용
          # 컨텍스트는 루트를 유지한다 — Dockerfile 이 gradle 소스를 COPY 하기 때문이다.
          # Dockerfile 위치만 docker/ 로 옮겼다.
          docker build \
            -f docker/Dockerfile \
            -t "$IMAGE:${{ steps.tag.outputs.value }}" \
            -t "$IMAGE:develop" \
            .
          docker push "$IMAGE:${{ steps.tag.outputs.value }}"
          docker push "$IMAGE:develop"

      - name: Deploy via SSM
        id: ssm
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail

          # compose 파일과 Caddyfile 을 base64 로 실어 보낸다.
          # S3 경유나 git clone 없이 한 번에 끝나고, 따옴표·개행 이스케이프 문제도 없다.
          COMPOSE_B64="$(base64 -w0 docker/docker-compose-ec2.yml)"
          CADDY_B64="$(base64 -w0 docker/Caddyfile)"

          # ⚠️ `up -d` 뒤의 두 줄은 순서와 이유가 있다 (#135).
          #   1. 대기: `caddy reload` 는 컨테이너 안 admin API(:2019)에 설정을 POST 한다. compose 의
          #      `Started` 는 프로세스가 떴다는 뜻이지 리스너가 열렸다는 뜻이 아니라서, 갓 재생성된
          #      직후에 바로 reload 하면 connection refused 로 배포가 거짓 실패한다(런 34132858477).
          #      2019 는 호스트에 노출돼 있지 않으므로 컨테이너 안에서 busybox wget 으로 확인한다
          #      (alpine 기반이라 이미지 버전과 무관하게 있다. curl 은 2.7/2.8-alpine 에 없고 최근
          #      이미지에만 있다 — 실측). 주소는 localhost 가 아니라 127.0.0.1 로 적는다 — admin 리스너는
          #      127.0.0.1 에만 열리는데 busybox wget 은 localhost 를 ::1 로 먼저 풀고 폴백하지 않아
          #      영원히 실패한다(로컬 실측).
          #      상한은 busybox `timeout 60` 의 벽시계 60초다. 시도 횟수로 상한을 두면 연결은 되는데
          #      응답이 없는 경우 시도마다 -T 2 가 붙어 실제 상한이 두 배가 된다(이종 리뷰에서 잡힘).
          #      정상 기동은 50ms 안에 열리므로(로컬 5회 실측) 보통 첫 회에 빠져나간다. 상한이 짧으면
          #      부하 상황에서 이 이슈의 거짓 실패가 재발하므로 넉넉히 둔다 — 초과 대기 비용은 이미
          #      망가진 배포에서만 낸다. 넘기면 stderr 에 메시지를 남기고 실패한다(`|| { ...; exit 1; }`).
          #      루프를 exec 한 번 안에서 돌리는 이유: 호스트 루프면 `set -x` 가 시도마다 trace 를
          #      남겨 SSM 이 자르는 출력을 잡아먹는다. 컨테이너가 running 이 아니면(기동 크래시 루프)
          #      exec 자체가 docker 메시지와 함께 즉시 실패하는데, 그건 기다려도 낫지 않으니 의도된 것.
          #   2. reload: Caddyfile 은 bind mount(docker-compose-ec2.yml)라 내용만 바뀐 배포에서는
          #      `up -d` 가 컨테이너를 재생성하지 않는다. reload 가 그 경로를 메운다. 지우면 회귀.
          #   `|| true` 로 감싸지 않는다 — 문법이 틀린 Caddyfile 이 조용히 무시되면 배포는 초록인데
          #   옛 설정이 계속 도는 최악이 된다. 대기는 "아직 안 떴다" 만 흡수하고 설정 오류는 실패로 남긴다.
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${IMAGE_TAG}" \
            --timeout-seconds 600 \
            --parameters commands="[
              \"set -euxo pipefail\",
              \"cd /opt/pickple\",
              \"echo $COMPOSE_B64 | base64 -d > docker-compose-ec2.yml\",
              \"echo $CADDY_B64 | base64 -d > Caddyfile\",
              \"/usr/local/bin/fetch-secrets.sh\",
              \"sed -i 's|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|' .env || echo 'IMAGE_TAG=${IMAGE_TAG}' >> .env\",
              \"aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ vars.ECR_REGISTRY }}\",
              \"docker compose -f docker-compose-ec2.yml pull\",
              \"docker compose -f docker-compose-ec2.yml up -d --remove-orphans\",
              \"docker compose -f docker-compose-ec2.yml exec -T caddy timeout 60 sh -c 'until wget -qO- -T 2 http://127.0.0.1:2019/config/ >/dev/null 2>&1; do sleep 2; done' || { echo caddy admin API :2019 not ready after 60s, reload skipped >&2; exit 1; }\",
              \"docker compose -f docker-compose-ec2.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile\",
              \"docker image prune -f\"
            ]" \
            --query 'Command.CommandId' --output text)"

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM Command: $COMMAND_ID"

          # 완료까지 대기. 이미지 pull 이 30~60초 걸리므로 넉넉히 잡는다.
          for _ in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)"
            echo "  status=$STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut)
                # ⚠️ SSM 은 출력을 약 2,500자에서 자른다. stdout·stderr 를 모두 찍고,
                #    그래도 부족하면 인스턴스에 직접 들어가 /var/log/user-data.log 를 본다.
                echo "--- stdout ---"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text || true
                echo "--- stderr ---"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' --output text || true
                echo "출력이 잘렸으면: aws ssm start-session --target $INSTANCE_ID"
                exit 1 ;;
            esac
            sleep 10
          done
          echo "배포 대기 시간을 초과했습니다." >&2
          exit 1

      - name: Verify health
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          # 앱 기동(start_period 90s)을 기다린 뒤 EC2 안에서 헬스체크한다.
          # actuator 는 관리 포트(9090)에 있다.
          CMD="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 300 \
            --parameters commands="[
              \"for i in \$(seq 1 30); do curl -fsS http://localhost/actuator/health && exit 0; sleep 10; done; exit 1\"
            ]" \
            --query 'Command.CommandId' --output text)"

          for _ in $(seq 1 40); do
            S="$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE_ID" \
                 --query 'Status' --output text 2>/dev/null || echo Pending)"
            case "$S" in
              Success)
                aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text
                exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' --output text
                exit 1 ;;
            esac
            sleep 10
          done
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### 배포 결과"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 이미지 태그 | \`${{ steps.tag.outputs.value }}\` |"
            echo "| SSM Command | \`${{ steps.ssm.outputs.command_id }}\` |"
            echo ""
            echo "롤백: Actions → deploy-develop → Run workflow → 이전 태그 입력"
          } >> "$GITHUB_STEP_SUMMARY"
