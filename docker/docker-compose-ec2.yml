# EC2 (develop) 전용 compose. 현재 유일한 배포 파일이다(ADR-0024).
#
# 원래는 docker-compose-prod.yml 을 오버레이(-f a -f b)로 재사용하지 않고 별도 파일로 둔
# 결정이었다(PRD-007). 그 prod 파일은 dev 와 바이트 단위로 동일한 사본이었고 CI 참조가
# 0 건이라 ADR-0024 에서 삭제했다. 아래 이유는 완결형 파일을 유지하는 근거로 여전히 유효하다.
#   1. 오버레이로 image: 만 얹으면 compose 는 build: 와 image: 가 둘 다 있는 것으로 보고
#      "그 이름으로 빌드"한다. EC2 에서 Gradle 빌드가 돌아 2GB 인스턴스가 OOM 으로 죽는다.
#      (build: !reset 으로 지울 수 있으나 compose 버전 의존성이 생긴다.)
#   2. 포트 정책이 정반대다 — 로컬은 DB 를 노출하고 EC2 는 막는다.
#   3. 관측성 스택을 제외해야 한다(ADR-0012).
#
# 이 파일은 GitHub Actions 가 SSM 으로 EC2 의 /opt/pickple 에 배치한다.
# .env 는 fetch-secrets.sh 가 Secrets Manager 에서 만든다.

services:
  mysql:
    image: mysql:8.4
    container_name: ${COMPOSE_PROJECT_NAME:-pickple}-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?fetch-secrets.sh 가 .env 를 만들지 못했습니다}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pickple}
      MYSQL_USER: ${MYSQL_USER:-pickple}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?fetch-secrets.sh 가 .env 를 만들지 못했습니다}
      TZ: ${TZ:-Asia/Seoul}
    # ports 매핑이 없다. 3306 은 compose 내부 네트워크에서만 보인다.
    # 외부에서 접속해야 하면 SSM 포트 포워딩을 쓴다(README 참조).
    # 외부 DB 툴 접속용(ADR-0023). 호스트 13307 → 컨테이너 3306.
    # ⚠️ 0.0.0.0 바인딩이라 보안그룹의 mysql 규칙과 합쳐지면 인터넷에 노출된다.
    #    terraform 의 var.mysql_host_port 와 반드시 같은 값이어야 한다.
    ports:
      - "13307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --lower_case_table_names=0
      - --default-time-zone=+09:00
      - --max_connections=200
      # 2GB 인스턴스에 맞춘다. 기본 128M 보다 키우되 JVM 몫을 남긴다.
      - --innodb-buffer-pool-size=256M
    volumes:
      # named volume 이 아니라 **별도 EBS 를 마운트한 경로**에 바인드한다.
      # 이것이 인스턴스 replace 를 견디는 유일한 이유다(ADR-0012 판정 2).
      - /data/mysql:/var/lib/mysql
    healthcheck:
      # 앱이 DB 준비 전에 떠서 Flyway 가 실패하는 것을 막는다.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: 700m

  app:
    # 빌드하지 않는다. GitHub Actions 가 만든 이미지를 ECR 에서 받는다.
    # IMAGE_TAG 는 배포 시 SSM 이 불변 태그(develop-<run_id>)를 넘긴다 → 태그 지정만으로 롤백된다.
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG:-develop}
    container_name: ${COMPOSE_PROJECT_NAME:-pickple}-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-pickple}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-pickple}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY 가 비어 있습니다}
      # ⚠️ :- 는 변수가 "미설정"일 때만 발동한다. .env 에 빈 값이 있으면 빈 문자열이
      #    그대로 전달돼 application.yml 의 기본값을 덮고, Spring 이
      #    "Client id of registration must not be empty" 로 기동을 거부한다.
      #    Secrets Manager 값을 비워두지 말고 not-configured 를 넣어라.
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-not-configured}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-not-configured}
      OAUTH_KAKAO_CLIENT_ID: ${OAUTH_KAKAO_CLIENT_ID:-not-configured}
      OAUTH_KAKAO_CLIENT_SECRET: ${OAUTH_KAKAO_CLIENT_SECRET:-not-configured}
      OAUTH_NAVER_CLIENT_ID: ${OAUTH_NAVER_CLIENT_ID:-not-configured}
      OAUTH_NAVER_CLIENT_SECRET: ${OAUTH_NAVER_CLIENT_SECRET:-not-configured}
      OAUTH_APPLE_ENABLED: ${OAUTH_APPLE_ENABLED:-false}
      OAUTH_APPLE_TEAM_ID: ${OAUTH_APPLE_TEAM_ID:-not-configured}
      OAUTH_APPLE_KEY_ID: ${OAUTH_APPLE_KEY_ID:-not-configured}
      OAUTH_APPLE_CLIENT_ID: ${OAUTH_APPLE_CLIENT_ID:-not-configured}
      OAUTH_APPLE_PRIVATE_KEY_BASE64: ${OAUTH_APPLE_PRIVATE_KEY_BASE64:-not-configured}
      OAUTH_APPLE_TOKEN_ENCRYPTION_KEYS: ${OAUTH_APPLE_TOKEN_ENCRYPTION_KEYS:-not-configured}
      OAUTH_APPLE_TOKEN_ACTIVE_KEY_ID: ${OAUTH_APPLE_TOKEN_ACTIVE_KEY_ID:-not-configured}
      # ── HTTPS 뒤에서 동작하기 위한 값 (ADR-0022). 비밀이 아니라 여기 리터럴로 둔다.
      # fetch-secrets.sh 에 넣지 않는 이유: 그 스크립트는 user_data 가 최초 부팅 때 한 번 써 놓는
      # 파일이라 템플릿을 고쳐도 떠 있는 인스턴스에 반영되지 않는다. 이 파일은 배포마다 SSM 으로
      # 다시 실리므로 값 변경 = PR + 배포로 끝난다.
      # Caddy 가 TLS 를 벗기고 평문으로 넘기므로 X-Forwarded-Proto 를 신뢰해야 OAuth {baseUrl} 이
      # https 가 된다. 8080 은 compose 네트워크 안에만 있고 SG 에도 없어 Caddy 가 유일한 입구다.
      # 이미지 업로드 S3 (ADR-0021, ADR-0027).
      # 자격증명은 넣지 않는다. EC2 인스턴스 프로파일을 SDK 가 IMDS 로 가져간다(ADR-0013).
      # IMAGE_S3_ENDPOINT 는 일부러 빠져 있다 — 값이 있으면 endpointOverride 가 켜져
      # 실제 AWS 로 나가지 못하므로, 목록에 없는 편이 안전하다.
      IMAGE_S3_BUCKET: ${IMAGE_S3_BUCKET:-not-configured}
      # 빈 값이 정상 동작이다(SDK 가 S3 객체 URL 로 폴백). not-configured 로 "고치지" 말 것.
      IMAGE_PUBLIC_BASE_URL: ${IMAGE_PUBLIC_BASE_URL:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      AUTH_COOKIE_SECURE: "true"
      # 프론트 배포 URL 이 정해지면 아래 세 기본값을 바꾼다(PRD-008 열린 질문).
      AUTH_REDIRECT_URI: ${AUTH_REDIRECT_URI:-http://localhost:3000/oauth/callback}
      AUTH_ALLOWED_REDIRECT_HOSTS: ${AUTH_ALLOWED_REDIRECT_HOSTS:-localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      TZ: ${TZ:-Asia/Seoul}
      LOG_DIR: /app/logs
      LOG_MAX_HISTORY: ${LOG_MAX_HISTORY:-14}
      # 10GB 데이터 볼륨(/data)에 MySQL·JFR 과 함께 산다. prod 기본값(3GB)보다 줄인다.
      LOG_TOTAL_SIZE_CAP: ${LOG_TOTAL_SIZE_CAP:-1GB}
    volumes:
      # 영속 EBS 에 직접 bind 한다(ADR-0025). named volume 은 루트 볼륨에 있어
      # 인스턴스를 replace 하면 로그가 사라졌다.
      # ⚠️ bind mount 는 이미지의 소유권을 복사하지 않는다. 호스트에서 미리
      #    chown 100:101 /data/logs 가 되어 있어야 앱(uid 100)이 쓸 수 있다.
      - /data/logs:/app/logs
    # ports 매핑이 없다. Caddy 가 compose 네트워크로 프록시하므로 8080 을 노출할 이유가 없다.
    healthcheck:
      # actuator 는 관리 포트(9090)에만 있다. 서비스 포트(8080)엔 없다.
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    # Dockerfile 의 MaxRAMPercentage=75 가 이 한도를 읽는다 → 힙 상한 ≈ 900MB.
    mem_limit: 1200m

  caddy:
    image: caddy:2-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-pickple}-caddy
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # 사이트 주소. 도메인이면 Caddy 가 Let's Encrypt 로 자동 HTTPS (ADR-0022).
      SITE_ADDRESS: ${SITE_ADDRESS:-dev-api.pickple.app}
    ports:
      # 80 은 ACME HTTP-01 과 80→443 리다이렉트. HTTP/3(443/udp)은 SG 에 UDP 규칙이 없어 열지 않는다.
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 인증서·ACME 계정은 영속 EBS(/data)에 둔다. 루트 볼륨의 named volume 에 두면
      # 인스턴스 교체마다 재발급되고 Let's Encrypt 는 같은 호스트에 주 5회까지만 내준다.
      - /data/caddy:/data
      - caddy_config:/config
    mem_limit: 128m

volumes:
  caddy_config:
    name: ${COMPOSE_PROJECT_NAME:-pickple}-caddy-config
