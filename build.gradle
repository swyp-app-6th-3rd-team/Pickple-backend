plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    // 포털 기준 최신(1.19.0)을 쓴다. Maven Central 은 1.15.0 에서 멈춰 있는데
    // 그건 이 플러그인이 Gradle Plugin Portal 자체 저장소에 배포되기 때문이고,
    // 1.15.0(2023) 은 현재 Gradle 9.2.1 에서 깨진다(ADR-0050).
    id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'app.pickple'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    // QueryDSL 은 본가(com.querydsl)가 아니라 OpenFeign 포크를 쓴다.
    // 본가는 5.1.0 에서 멈춰 Hibernate 7 / Jakarta EE 11 을 지원하지 않는다.
    // Spring Boot 4.1 이 Hibernate 7.4.5 를 관리하므로 본가를 쓰면 빌드가 깨진다.
    querydslVersion = '7.5'
    jjwtVersion = '0.12.6'
    // 1.5.0 부터 JUnit 6 전용 모듈(archunit-junit6)이 나온다. junit5 모듈은 Platform 1.x 로
    // 빌드돼 junit-bom:5.12.2 제약을 들고 오는데, 그게 launcher 를 1.12.2 로 끌어내린다(ADR-0050).
    archunitVersion = '1.5.0'
    testcontainersVersion = '1.21.3'
    awsSdkVersion = '2.53.1'
}

dependencies {
    // Web / JPA
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Security / OAuth2
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // JWT
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // DB / Migration
    // Boot 4 는 자동설정을 모듈별로 쪼갰다. flyway-core 만 넣으면 라이브러리는 올라오지만
    // 자동설정이 붙지 않아 마이그레이션이 조용히 실행되지 않는다.
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Object storage — 서비스 코드는 AWS SDK v2 S3 클라이언트만 알고,
    // 테스트는 같은 클라이언트를 LocalStack endpoint 로 교체한다.
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    implementation 'software.amazon.awssdk:s3'

    // QueryDSL (OpenFeign fork)
    // 주의: annotationProcessor 의 classifier 는 ':jpa' 다. 본가에서 쓰던 ':jakarta' 가 아니다.
    // 잘못 쓰면 APT 가 붙지 않아 빌드는 성공하는데 Q 클래스만 생성되지 않는다.
    implementation "io.github.openfeign.querydsl:querydsl-jpa:${querydslVersion}"
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jpa"
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

    // API 문서 — springdoc 이 OpenAPI 스펙을 만들고, Scalar 가 그 스펙을 보여준다.
    // Swagger UI(/swagger-ui.html) 와 Scalar(/scalar) 를 둘 다 띄워두고 취향에 맞는 쪽을 쓴다.
    //
    // springdoc 은 3.x 가 Spring Boot 4 / Spring Data 4 대응 라인이다.
    // 2.x 를 쓰면 QuerydslPredicateOperationCustomizer 가 Spring Data 3 의
    // TypeInformation 을 찾다가 NoClassDefFoundError 로 기동이 실패한다.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    implementation 'com.scalar.maven:scalar-webmvc:0.6.61'

    // Lombok — 도메인 계층에서는 쓰지 않는다(ArchitectureTest 가 강제).
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Test
    // Testcontainers 는 Spring Boot BOM 이 버전을 관리하지 않으므로 자체 BOM 을 import 한다.
    testImplementation platform("org.testcontainers:testcontainers-bom:${testcontainersVersion}")
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.testcontainers:localstack'
    testImplementation 'org.testcontainers:junit-jupiter'
    // junit5 가 아니라 junit6 모듈을 쓴다. Boot 4.1 이 관리하는 JUnit 이 6.0.3 이라
    // junit5 모듈(Platform 1.x)을 쓰면 pitest 가 launcher 를 올리는 순간 버전이 어긋난다.
    testImplementation "com.tngtech.archunit:archunit-junit6:${archunitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations.configureEach {
    // 본가 QueryDSL 이 전이 의존으로라도 올라오면 포크와 같은 com.querydsl.* 패키지를 써서 충돌한다.
    exclude group: 'com.querydsl'
}

tasks.named('test') {
    useJUnitPlatform()

    // 테스트 JVM 의 기본 타임존을 운영과 맞춘다.
    //
    // 이 저장소는 시간 값을 두 경로로 쓴다 — Hibernate(`hibernate.jdbc.time_zone: Asia/Seoul`)와
    // 픽스처의 JdbcTemplate(설정을 모르므로 JVM 기본 존을 쓴다). 두 규칙은 JVM 이
    // Asia/Seoul 일 때만 같은 값을 만든다. 기본 존이 UTC 인 CI 러너에서는 Hibernate 가
    // LocalDateTime 을 UTC 벽시계로 보고 변환해 9시간 밀린 값을 바인딩하고,
    // 같은 조건으로 조회해도 JdbcTemplate 이 심은 행을 찾지 못한다(실측: 같은 SQL 에
    // JdbcTemplate 1건 / Hibernate 0건).
    //
    // 여유가 큰 테스트는 9시간 오차를 흡수해 통과하므로 이 어긋남이 오래 드러나지 않았다.
    // 경계가 1초인 판정(§7.4)에서 비로소 결정적으로 실패한다.
    //
    // 운영은 Asia/Seoul 로 돌고 DB 도 `--default-time-zone=+09:00` 이다(ContainerConfig).
    // 테스트만 UTC 로 도는 것이 어긋남이므로, 회피가 아니라 환경을 맞춘다.
    systemProperty 'user.timezone', 'Asia/Seoul'

    finalizedBy jacocoTestReport
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        showStandardStreams = project.hasProperty('showSql')
    }
}

// 유닛만 도는 태스크. Docker 없이 도는 빠른 피드백 경로이고, 뮤테이션 테스트의 대상이다.
//
// 유닛과 통합은 클래스 이름 규약으로 가른다. `@IntegrationTest` 는 `@Tag` 가 아니라
// `@SpringBootTest` 메타 애노테이션이라 JUnit Platform 태그 필터로는 고를 수 없다.
// 대신 ArchitectureTest 가 "`@IntegrationTest` 면 이름이 IT 로 끝난다" 를 강제하므로
// 그 규약에 기대어 제외한다. 다만 제외 수단은 이름 필터가 아니라 **클래스 파일 패턴**이다
// (아래 `exclude` 주석 참조 — 이름 필터는 메서드까지 걸려 규칙을 빼먹는다).
tasks.register('unitTest', Test) {
    description = '통합 테스트(*IT)를 제외한 단위·아키텍처 테스트만 실행한다'
    group = 'verification'

    // 소스셋을 명시하지 않으면 testClassesDirs·classpath 가 비어 Gradle 이 NO-SOURCE 로
    // 건너뛰고도 BUILD SUCCESSFUL 을 낸다(테스트 0개 실행). 반드시 test 소스셋에 연결한다.
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform()

    // test 와 같은 이유로 타임존을 맞춘다. 빠지면 시간 판정이 9시간 밀린다(위 주석 참조).
    systemProperty 'user.timezone', 'Asia/Seoul'

    // 클래스 파일 기준으로 제외한다. 이름 필터(`excludeTestsMatching`)를 쓰면 안 된다 —
    // Gradle 이 패턴을 **메서드 이름에도** 적용해서, `*IT` 는 ArchitectureTest 의
    // `integrationTestsEndWithIT()` 규칙을 조용히 빼버린다(실측: ArchUnit 24개 -> 23개).
    // 하필 유닛·통합 분리를 보장하는 그 규칙이라, 분리의 근거가 사라진다.
    // `*IT.*` 로 고쳐도 이번엔 ActivityControllerIT 가 새어 들어왔다(실측: 476 -> 575개).
    // 파일 패턴은 클래스에만 걸리므로 두 함정을 모두 피한다.
    exclude '**/*IT.class'

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// 뮤테이션 테스트. 커버리지가 답하지 못하는 "단언이 실제로 잡는가" 를 판정한다.
//
// 대상을 도메인·서비스로 좁히는 이유: 판정 로직이 거기 있다. 엔티티·설정에 뮤턴트를
// 만들어도 의미 있는 신호가 나오지 않고 실행 시간만 늘어난다.
// 테스트는 유닛만 쓴다 — 통합을 넣으면 Testcontainers 가 뮤턴트마다 떠서 시간이 폭발한다.
pitest {
    pitestVersion = '1.30.0'
    junit5PluginVersion = '1.2.3'

    // 플러그인이 detached configuration 에서 고른 launcher 를 testRuntimeOnly 에 **직접 버전까지
    // 박아** 추가한다. 그러면 launcher 는 6.1.2, engine 은 Boot 가 관리하는 6.0.3 으로 갈려
    // launcher 가 선언한 engine(6.1.2)이 도로 내려앉는다. 지금은 통과하지만 정렬된 상태는 아니다.
    // 주입을 끄면 이 저장소가 이미 갖고 있는 버전 없는 launcher 선언이 BOM 을 따라간다.
    addJUnitPlatformLauncher = false

    // test 와 같은 이유로 타임존을 맞춘다(시간 판정이 9시간 밀린다).
    jvmArgs = ['-Duser.timezone=Asia/Seoul']

    targetClasses = [
            'app.pickple.*.domain.*',
            'app.pickple.*.service.*',
    ]
    // JPA 엔티티는 `*/infra/*Entity` 라서 애초에 targetClasses(domain·service)에 들지 않는다.
    // `*.entity.*` 같은 패턴은 이 저장소에 매칭되는 클래스가 없어(ADR-0008 로 분리) 적지 않는다.
    excludedClasses = [
            'app.pickple.config.*',
            'app.pickple.docs.*',
    ]
    // 아키텍처 테스트는 바이트코드를 스캔할 뿐 도메인 로직을 검증하지 않는다.
    // 뮤턴트를 죽이지 못하면서 매 뮤턴트마다 전체 클래스패스를 훑어 느리다.
    //
    // 여기서는 `*IT` 라는 이름 패턴을 써도 안전하다. 위 unitTest 에서 위험했던 것과 계층이 다르다 —
    // 이건 PIT 자체 DSL 의 **클래스 FQN glob** 이라 메서드 이름에는 닿지 않는다.
    // 반면 Gradle 의 `excludeTestsMatching` 은 메서드까지 훑어서 규칙 하나를 빼먹었다.
    // `*IT` 는 PIT 안에서 `^.*IT$` 로 바뀌므로 중첩 클래스(`FooIT$Nested`)는 걸리지 않는다.
    // 현재 통합 테스트에 중첩 클래스가 없어 새는 것은 없지만, 생기면 조용히 대상에 들어오므로
    // `*IT$*` 를 함께 둔다.
    excludedTestClasses = [
            'app.pickple.architecture.*',
            'app.pickple.docs.*',
            '*IT',
            '*IT$*',
    ]

    outputFormats = ['XML', 'HTML']
    timestampedReports = false
    threads = 4

    // 첫 도입의 바닥값이다. 목표가 아니라 회귀 차단선이다(ADR-0050).
    mutationThreshold = 60
}

// 판정할 로직이 없어 분모만 키우는 것들. 커버리지 산정에서 뺀다.
// - Q* : QueryDSL 이 생성한 클래스(사람이 쓰지 않는다)
// - config/docs : 설정과 문서 표면. 분기가 거의 없다
// - PickpleApplication : 엔트리포인트
def coverageExclusions = [
        '**/Q*.class',
        'app/pickple/config/**',
        'app/pickple/docs/**',
        'app/pickple/PickpleApplication.class',
]

// 두 태스크가 같은 제외 목록을 쓴다. 클로저를 복사해 두면 한쪽만 고치고 잊기 쉬워 함수로 뺀다.
//
// `afterEvaluate` 는 Task 가 아니라 Project 의 메서드다. task.afterEvaluate 로 쓰면
// "Could not find method afterEvaluate() ... on task ':jacocoTestReport'" 로 설정 단계에서 깨진다.
def applyCoverageExclusions = { task ->
    project.afterEvaluate {
        task.classDirectories.setFrom(task.classDirectories.files.collect {
            fileTree(dir: it, exclude: coverageExclusions)
        })
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}
applyCoverageExclusions(tasks.named('jacocoTestReport').get())

// 커버리지 하한선. 목표치가 아니라 실측 바로 아래다 — 이 게이트의 목적은
// 향상 강제가 아니라 회귀 차단이기 때문이다(ADR-0050).
// 도입 시점 실측: LINE 91.7% / BRANCH 81.4%.
jacocoTestCoverageVerification {
    dependsOn jacocoTestReport

    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

// 리포트와 검증이 **같은 클래스 집합**을 봐야 한다. 한쪽에만 제외를 걸면
// 리포트는 91.5% 인데 게이트는 다른 모수로 판정해, 통과해도 근거가 다른 상태가 된다.
applyCoverageExclusions(tasks.named('jacocoTestCoverageVerification').get())

// check 에 걸어 기존 CI 의 `./gradlew build` 가 그대로 판정하게 한다(CI 수정 불필요).
tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}

// 생성된 Q 클래스를 IDE 가 소스로 인식하고, clean 시 함께 지워지도록 한다.
def generatedDir = layout.buildDirectory.dir('generated/sources/annotationProcessor/java/main')

sourceSets {
    main {
        java {
            srcDir generatedDir
        }
    }
}

// Git 훅을 저장소 안의 .githooks 로 돌린다.
// 훅은 clone 으로 따라오지 않으므로 빌드가 한 번 돌면 자동으로 연결되게 한다.
// 이미 .githooks 를 가리키고 있으면 상대·절대경로 어느 쪽이든 그대로 둔다.
// 다른 곳을 가리키면 사용자 설정으로 보고 건드리지 않는다.
def installGitHooks = tasks.register('installGitHooks') {
    description = '브랜치 이름과 rebase 정책 훅을 활성화한다'
    group = 'build setup'

    def hooksDir = file('.githooks')
    def gitDir = file('.git')
    onlyIf { gitDir.exists() && hooksDir.exists() }

    doLast {
        def current = providers.exec {
            commandLine 'git', 'config', '--get', 'core.hooksPath'
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()

        // 절대경로로 설정된 경우도 같은 디렉터리를 가리키면 정상으로 본다.
        if (current && file(current).canonicalPath == hooksDir.canonicalPath) {
            return
        }
        if (current) {
            logger.lifecycle("core.hooksPath 가 이미 '${current}' 로 설정돼 있어 건드리지 않는다.")
            return
        }

        providers.exec {
            commandLine 'git', 'config', 'core.hooksPath', '.githooks'
        }.result.get()
        logger.lifecycle('core.hooksPath 를 .githooks 로 설정했다.')
    }
}

tasks.matching { it.name == 'compileJava' }.configureEach {
    dependsOn installGitHooks
}
