plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'app.pickple'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    // QueryDSL 은 본가(com.querydsl)가 아니라 OpenFeign 포크를 쓴다.
    // 본가는 5.1.0 에서 멈춰 Hibernate 7 / Jakarta EE 11 을 지원하지 않는다.
    // Spring Boot 4.1 이 Hibernate 7.4.5 를 관리하므로 본가를 쓰면 빌드가 깨진다.
    querydslVersion = '7.5'
    jjwtVersion = '0.12.6'
    archunitVersion = '1.4.1'
    testcontainersVersion = '1.21.3'
    awsSdkVersion = '2.53.1'
}

dependencies {
    // Web / JPA
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Security / OAuth2
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // JWT
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // DB / Migration
    // Boot 4 는 자동설정을 모듈별로 쪼갰다. flyway-core 만 넣으면 라이브러리는 올라오지만
    // 자동설정이 붙지 않아 마이그레이션이 조용히 실행되지 않는다.
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Object storage — 서비스 코드는 AWS SDK v2 S3 클라이언트만 알고,
    // 테스트는 같은 클라이언트를 LocalStack endpoint 로 교체한다.
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    implementation 'software.amazon.awssdk:s3'

    // QueryDSL (OpenFeign fork)
    // 주의: annotationProcessor 의 classifier 는 ':jpa' 다. 본가에서 쓰던 ':jakarta' 가 아니다.
    // 잘못 쓰면 APT 가 붙지 않아 빌드는 성공하는데 Q 클래스만 생성되지 않는다.
    implementation "io.github.openfeign.querydsl:querydsl-jpa:${querydslVersion}"
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jpa"
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

    // API 문서 — springdoc 이 OpenAPI 스펙을 만들고, Scalar 가 그 스펙을 보여준다.
    // Swagger UI(/swagger-ui.html) 와 Scalar(/scalar) 를 둘 다 띄워두고 취향에 맞는 쪽을 쓴다.
    //
    // springdoc 은 3.x 가 Spring Boot 4 / Spring Data 4 대응 라인이다.
    // 2.x 를 쓰면 QuerydslPredicateOperationCustomizer 가 Spring Data 3 의
    // TypeInformation 을 찾다가 NoClassDefFoundError 로 기동이 실패한다.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    implementation 'com.scalar.maven:scalar-webmvc:0.6.61'

    // Lombok — 도메인 계층에서는 쓰지 않는다(ArchitectureTest 가 강제).
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Test
    // Testcontainers 는 Spring Boot BOM 이 버전을 관리하지 않으므로 자체 BOM 을 import 한다.
    testImplementation platform("org.testcontainers:testcontainers-bom:${testcontainersVersion}")
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.testcontainers:localstack'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation "com.tngtech.archunit:archunit-junit5:${archunitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations.configureEach {
    // 본가 QueryDSL 이 전이 의존으로라도 올라오면 포크와 같은 com.querydsl.* 패키지를 써서 충돌한다.
    exclude group: 'com.querydsl'
}

tasks.named('test') {
    useJUnitPlatform()

    // 테스트 JVM 의 기본 타임존을 운영과 맞춘다.
    //
    // 이 저장소는 시간 값을 두 경로로 쓴다 — Hibernate(`hibernate.jdbc.time_zone: Asia/Seoul`)와
    // 픽스처의 JdbcTemplate(설정을 모르므로 JVM 기본 존을 쓴다). 두 규칙은 JVM 이
    // Asia/Seoul 일 때만 같은 값을 만든다. 기본 존이 UTC 인 CI 러너에서는 Hibernate 가
    // LocalDateTime 을 UTC 벽시계로 보고 변환해 9시간 밀린 값을 바인딩하고,
    // 같은 조건으로 조회해도 JdbcTemplate 이 심은 행을 찾지 못한다(실측: 같은 SQL 에
    // JdbcTemplate 1건 / Hibernate 0건).
    //
    // 여유가 큰 테스트는 9시간 오차를 흡수해 통과하므로 이 어긋남이 오래 드러나지 않았다.
    // 경계가 1초인 판정(§7.4)에서 비로소 결정적으로 실패한다.
    //
    // 운영은 Asia/Seoul 로 돌고 DB 도 `--default-time-zone=+09:00` 이다(ContainerConfig).
    // 테스트만 UTC 로 도는 것이 어긋남이므로, 회피가 아니라 환경을 맞춘다.
    systemProperty 'user.timezone', 'Asia/Seoul'

    finalizedBy jacocoTestReport
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        showStandardStreams = project.hasProperty('showSql')
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// 생성된 Q 클래스를 IDE 가 소스로 인식하고, clean 시 함께 지워지도록 한다.
def generatedDir = layout.buildDirectory.dir('generated/sources/annotationProcessor/java/main')

sourceSets {
    main {
        java {
            srcDir generatedDir
        }
    }
}

// Git 훅을 저장소 안의 .githooks 로 돌린다.
// 훅은 clone 으로 따라오지 않으므로 빌드가 한 번 돌면 자동으로 연결되게 한다.
// 이미 .githooks 를 가리키고 있으면 상대·절대경로 어느 쪽이든 그대로 둔다.
// 다른 곳을 가리키면 사용자 설정으로 보고 건드리지 않는다.
def installGitHooks = tasks.register('installGitHooks') {
    description = '브랜치 이름과 rebase 정책 훅을 활성화한다'
    group = 'build setup'

    def hooksDir = file('.githooks')
    def gitDir = file('.git')
    onlyIf { gitDir.exists() && hooksDir.exists() }

    doLast {
        def current = providers.exec {
            commandLine 'git', 'config', '--get', 'core.hooksPath'
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()

        // 절대경로로 설정된 경우도 같은 디렉터리를 가리키면 정상으로 본다.
        if (current && file(current).canonicalPath == hooksDir.canonicalPath) {
            return
        }
        if (current) {
            logger.lifecycle("core.hooksPath 가 이미 '${current}' 로 설정돼 있어 건드리지 않는다.")
            return
        }

        providers.exec {
            commandLine 'git', 'config', 'core.hooksPath', '.githooks'
        }.result.get()
        logger.lifecycle('core.hooksPath 를 .githooks 로 설정했다.')
    }
}

tasks.matching { it.name == 'compileJava' }.configureEach {
    dependsOn installGitHooks
}
