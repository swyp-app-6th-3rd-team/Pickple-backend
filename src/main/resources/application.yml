spring:
  application:
    name: pickple

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:13307/pickple?characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME:pickple}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-app}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    # validate: 엔티티와 실제 스키마가 어긋나면 기동 시점에 잡는다.
    # 스키마 변경은 전부 Flyway 로만 한다.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  servlet:
    multipart:
      # 서블릿 경계와 서비스 정책을 둘 다 둔다. MockMvc는 이 경계를 우회할 수 있어
      # 서비스에서도 파일당 크기를 다시 검증한다.
      max-file-size: ${FILE_MAX_SIZE:5MB}
      # 5MB 파일 3개의 multipart boundary/header 여유를 포함한다.
      max-request-size: ${FILE_MAX_REQUEST_SIZE:16MB}

  security:
    oauth2:
      client:
        # client-id 가 비어 있으면 Spring 이 기동 자체를 거부한다.
        # 템플릿에서는 일부 프로바이더만 쓰는 경우가 많으므로 자리표시자를 둔다.
        # 실제 값이 없으면 해당 프로바이더 로그인만 실패하고 앱은 정상 기동한다.
        registration:
          google:
            client-id: ${OAUTH_GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:not-configured}
            scope:
              - email
              - profile
          kakao:
            client-id: ${OAUTH_KAKAO_CLIENT_ID:not-configured}
            client-secret: ${OAUTH_KAKAO_CLIENT_SECRET:not-configured}
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
          naver:
            client-id: ${OAUTH_NAVER_CLIENT_ID:not-configured}
            client-secret: ${OAUTH_NAVER_CLIENT_SECRET:not-configured}
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - name
        provider:
          # Google 은 Spring Security 가 기본 제공하므로 provider 설정이 필요 없다.
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            # Naver 는 응답을 response 객체로 한 번 감싼다.
            user-name-attribute: response

app:
  jwt:
    # 기본값을 두지 않는다. 미설정 시 기동을 실패시켜 문제를 즉시 드러낸다.
    # 설정 파일에 키를 하드코딩하면 저장소에 그대로 커밋된다.
    secret-key: ${JWT_SECRET_KEY}
    access-token-validity: PT30M
    refresh-token-validity: P14D
    issuer: pickple
  auth:
    # 소셜 로그인 성공 후 프런트로 돌려보낼 주소.
    # 액세스 토큰은 쿼리파라미터, 리프레시 토큰은 HttpOnly 쿠키로 전달한다.
    redirect-uri: ${AUTH_REDIRECT_URI:http://localhost:3000/oauth/callback}
    allowed-redirect-hosts: ${AUTH_ALLOWED_REDIRECT_HOSTS:localhost}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ranking:
    # 작성자 랭킹 사전 계산 배치 (ADR-0028).
    # 순위는 전역 값이라 조회 시점에 세면 회원 전체를 정렬해야 한다(200k 기준 97.6ms/조각).
    # 미리 계산해 두고 목록은 읽기만 한다.
    enabled: ${RANKING_BATCH_ENABLED:true}
    # 이 주기가 곧 랭킹 지연 상한이다 — 포인트가 바뀌면 최대 5분 뒤에 순위에 반영된다.
    # 값을 바꾸면 SPEC 의 응답 계약(§3.3)도 함께 고쳐야 한다.
    cron: ${RANKING_BATCH_CRON:0 */5 * * * *}
  oauth:
    apple:
      # 키를 받기 전에도 서버가 기동하도록 기본은 비활성이다.
      enabled: ${OAUTH_APPLE_ENABLED:false}
      team-id: ${OAUTH_APPLE_TEAM_ID:not-configured}
      key-id: ${OAUTH_APPLE_KEY_ID:not-configured}
      # 네이티브 iOS 로그인에서는 Bundle ID가 client_id다.
      client-id: ${OAUTH_APPLE_CLIENT_ID:not-configured}
      # AuthKey_*.p8 파일 전체를 Base64 한 단일 행. PEM 원문을 넣지 않는다.
      private-key-base64: ${OAUTH_APPLE_PRIVATE_KEY_BASE64:not-configured}
      # Apple provider refresh token을 DB에 보관할 때 쓰는 별도의 32바이트 AES 키(Base64).
      # Sign in with Apple .p8 또는 서비스 JWT secret을 재사용하지 않는다.
      # keyring 형식: key-id=base64-32-byte-key,key-id-2=base64-32-byte-key
      provider-token-encryption-keys: ${OAUTH_APPLE_TOKEN_ENCRYPTION_KEYS:not-configured}
      provider-token-active-key-id: ${OAUTH_APPLE_TOKEN_ACTIVE_KEY_ID:not-configured}
      api-base-url: https://appleid.apple.com
      issuer: https://appleid.apple.com
      jwk-set-uri: https://appleid.apple.com/auth/keys
      client-secret-validity: PT10M
  profile:
    # 프로필 이미지를 등록하지 않은 사용자에게 무작위로 하나를 준다(명세 §1.5).
    # 디자인이 이미지를 늘리거나 CDN 주소가 바뀌어도 배포 없이 교체할 수 있게 설정으로 받는다.
    default-image-urls: ${PROFILE_DEFAULT_IMAGE_URLS:https://images.pickple.app/defaults/profile-1.png,https://images.pickple.app/defaults/profile-2.png,https://images.pickple.app/defaults/profile-3.png,https://images.pickple.app/defaults/profile-4.png}
  file:
    max-file-size: ${FILE_MAX_SIZE:5MB}
    s3:
      bucket: ${FILE_S3_BUCKET:not-configured}
      region: ${AWS_REGION:ap-northeast-2}
      # LocalStack 같은 S3 호환 저장소에서만 지정한다. AWS S3는 빈 값으로 둔다.
      endpoint: ${FILE_S3_ENDPOINT:}
      # CloudFront 등 안정적인 공개 URL의 base. 비면 SDK가 S3 객체 URL을 만든다.
      public-base-url: ${FILE_PUBLIC_BASE_URL:}

server:
  # 리버스 프록시(Caddy) 뒤에서 X-Forwarded-Proto 로 scheme 을 복원한다. 없으면 OAuth 의
  # {baseUrl} 이 http:// 로 만들어져 redirect_uri_mismatch 가 난다(ADR-0022).
  # framework 는 헤더를 무조건 신뢰하므로 앱 포트가 프록시 뒤에만 있을 때 켠다. 로컬 기본 none.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}

management:
  # 관리 엔드포인트를 **서비스 포트와 분리**한다.
  #
  # 관리 포트는 compose 네트워크 안에만 열린다(호스트 포트 매핑 없음).
  # 서비스 포트로 actuator 를 노출하지 않으므로 내부 지표가 외부로 나가지 않는다.
  # EC2 에서는 SSM 포트 포워딩으로 붙는다(terraform/README.md 참조).
  server:
    port: ${MANAGEMENT_PORT:9090}

  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
  # 경로에서 /api prefix 를 걷어냈다(ADR-0029, #91). prefix 가 사라져 공통 접두어로
  # 고를 수 없으므로, 문서에 실리면 안 되는 것만 빼고 나머지를 전부 싣는다.
  #
  # 새 API 경로를 만들 때 여기에 손댈 일은 없다 — 자동으로 문서에 실린다.
  # 다만 공개하면 안 되는 경로(내부용·관리자용)를 새로 만들면 반드시 여기에 더한다.
  paths-to-exclude: /actuator/**, /scalar/**, /llms.txt, /llms.md, /error, /docs/**

# Scalar — springdoc 이 만든 스펙을 읽어 보여주는 API 문서 UI.
scalar:
  enabled: true
  url: /v3/api-docs
  path: /scalar
  page-title: Pickple API
  dark-mode: true
  telemetry: false

# llms.txt — 같은 스펙을 LLM 이 읽기 좋은 마크다운으로 낸다(/llms.txt, /llms.md).
# FE 가 API 계약을 프롬프트에 그대로 붙여넣는 용도. 근거: ADR-0011
llms-txt:
  enabled: true

logging:
  level:
    root: INFO
    app.pickple: DEBUG
