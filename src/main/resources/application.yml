spring:
  application:
    name: buy-or-pass

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:13307/buyorpass?characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME:buyorpass}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-app}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    # validate: 엔티티와 실제 스키마가 어긋나면 기동 시점에 잡는다.
    # 스키마 변경은 전부 Flyway 로만 한다.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  security:
    oauth2:
      client:
        # client-id 가 비어 있으면 Spring 이 기동 자체를 거부한다.
        # 템플릿에서는 일부 프로바이더만 쓰는 경우가 많으므로 자리표시자를 둔다.
        # 실제 값이 없으면 해당 프로바이더 로그인만 실패하고 앱은 정상 기동한다.
        registration:
          google:
            client-id: ${OAUTH_GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:not-configured}
            scope:
              - email
              - profile
          kakao:
            client-id: ${OAUTH_KAKAO_CLIENT_ID:not-configured}
            client-secret: ${OAUTH_KAKAO_CLIENT_SECRET:not-configured}
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
          naver:
            client-id: ${OAUTH_NAVER_CLIENT_ID:not-configured}
            client-secret: ${OAUTH_NAVER_CLIENT_SECRET:not-configured}
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - name
        provider:
          # Google 은 Spring Security 가 기본 제공하므로 provider 설정이 필요 없다.
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            # Naver 는 응답을 response 객체로 한 번 감싼다.
            user-name-attribute: response

app:
  jwt:
    # 기본값을 두지 않는다. 미설정 시 기동을 실패시켜 문제를 즉시 드러낸다.
    # 설정 파일에 키를 하드코딩하면 저장소에 그대로 커밋된다.
    secret-key: ${JWT_SECRET_KEY}
    access-token-validity: PT30M
    refresh-token-validity: P14D
    issuer: buy-or-pass
  auth:
    # 소셜 로그인 성공 후 프런트로 돌려보낼 주소.
    # 액세스 토큰은 쿼리파라미터, 리프레시 토큰은 HttpOnly 쿠키로 전달한다.
    redirect-uri: ${AUTH_REDIRECT_URI:http://localhost:3000/oauth/callback}
    allowed-redirect-hosts: ${AUTH_ALLOWED_REDIRECT_HOSTS:localhost}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  # 관리 엔드포인트를 **서비스 포트와 분리**한다.
  #
  # 관리 포트는 compose 네트워크 안에만 열린다(호스트 포트 매핑 없음).
  # 서비스 포트로 actuator 를 노출하지 않으므로 내부 지표가 외부로 나가지 않는다.
  # EC2 에서는 SSM 포트 포워딩으로 붙는다(terraform/README.md 참조).
  server:
    port: ${MANAGEMENT_PORT:9090}

  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/**

# Scalar — springdoc 이 만든 스펙을 읽어 보여주는 API 문서 UI.
scalar:
  enabled: true
  url: /v3/api-docs
  path: /scalar
  page-title: Buy or Pass API
  dark-mode: true
  telemetry: false

# llms.txt — 같은 스펙을 LLM 이 읽기 좋은 마크다운으로 낸다(/llms.txt, /llms.md).
# FE 가 API 계약을 프롬프트에 그대로 붙여넣는 용도. 근거: ADR-0011
llms-txt:
  enabled: true

logging:
  level:
    root: INFO
    app.pickple: DEBUG
